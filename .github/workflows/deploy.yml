# GitHub Actions workflow for deploying .NET isolated Azure Functions
# Based on: https://learn.microsoft.com/en-us/azure/azure-functions/functions-how-to-github-actions

name: Deploy Azure Function App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: 'red-scus-dotnetfunc-app'
  RESOURCE_GROUP: 'red-scus-dotnet-azfuncdemo-rg'
  LOCATION: 'southcentralus'
  DOTNET_VERSION: '8.0.x'
  # Bicep parameters (non-sensitive)
  ASP_NAME: 'dotnet-func-asp'
  SKU: 'EP1'
  LAW_NAME: 'red-scus-dotnetfunc-law'
  APP_INSIGHTS_NAME: 'red-scus-dotnetfunc-appinsights'
  STORAGE_ACCOUNT_NAME: 'redscusazfuncdemo582'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build and publish
        run: dotnet publish azfunc-demo.csproj -c Release -o ./publish

      - name: Create zip package
        run: |
          cd ./publish
          zip -r ../deployment.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: function-app-package
          path: deployment.zip

  deploy-infrastructure:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Bicep
        uses: azure/arm-deploy@v2
        with:
          scope: subscription
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          region: ${{ env.LOCATION }}
          deploymentName: dotnetcore-azfunction-deploy
          template: ./iac/bicep/create-dotnet-function-all.bicep
          parameters: >
            subscriptionId=${{ secrets.AZURE_SUBSCRIPTION_ID }}
            rgName=${{ env.RESOURCE_GROUP }}
            location=${{ env.LOCATION }}
            aspName=${{ env.ASP_NAME }}
            sku=${{ env.SKU }}
            lawName=${{ env.LAW_NAME }}
            appInsightsName=${{ env.APP_INSIGHTS_NAME }}
            storageAccountName=${{ env.STORAGE_ACCOUNT_NAME }}
            functionAppName=${{ env.AZURE_FUNCTIONAPP_NAME }}

  deploy-function:
    runs-on: ubuntu-latest
    needs: [build, deploy-infrastructure]
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: function-app-package

      - name: Deploy to Azure Functions
        run: |
          az functionapp deployment source config-zip \
            --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --src deployment.zip
