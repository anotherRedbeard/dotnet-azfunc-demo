# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# GitHub Actions workflow for deploying .NET isolated Azure Functions
# Based on: https://learn.microsoft.com/en-us/azure/azure-functions/functions-how-to-github-actions

name: Deploy Azure Function App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  AZURE_FUNCTIONAPP_NAME: 'red-scus-dotnetfunc-app'
  RESOURCE_GROUP: 'red-scus-dotnet-azfuncdemo-rg'
  LOCATION: 'southcentralus'
  DOTNET_VERSION: '8.0.x'
  # Bicep parameters (non-sensitive)
  ASP_NAME: 'dotnet-func-asp'
  SKU: 'EP1'
  LAW_NAME: 'red-scus-dotnetfunc-law'
  APP_INSIGHTS_NAME: 'red-scus-dotnetfunc-appinsights'
  STORAGE_ACCOUNT_NAME: 'redscusazfuncdemo582'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build and publish
        run: dotnet publish azfunc-demo.csproj -c Release -o ./publish

      - name: Create zip package
        run: |
          cd ./publish
          zip -r ../deployment.zip . -x "*.pdb"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: function-app-package
          path: deployment.zip

  deploy-infrastructure:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Bicep
        uses: azure/arm-deploy@v2
        with:
          scope: subscription
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          region: ${{ env.LOCATION }}
          deploymentName: dotnetcore-azfunction-deploy
          template: ./iac/bicep/create-dotnet-function-all.bicep
          parameters: >
            subscriptionId=${{ secrets.AZURE_SUBSCRIPTION_ID }}
            rgName=${{ env.RESOURCE_GROUP }}
            location=${{ env.LOCATION }}
            aspName=${{ env.ASP_NAME }}
            sku=${{ env.SKU }}
            lawName=${{ env.LAW_NAME }}
            appInsightsName=${{ env.APP_INSIGHTS_NAME }}
            storageAccountName=${{ env.STORAGE_ACCOUNT_NAME }}
            functionAppName=${{ env.AZURE_FUNCTIONAPP_NAME }}

  deploy-function:
    runs-on: ubuntu-latest
    needs: [build, deploy-infrastructure]
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: function-app-package

      - name: Deploy to Azure Functions
        run: |
          az functionapp deployment source config-zip \
            --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --src deployment.zip

  update-openapi-spec:
    runs-on: ubuntu-latest
    needs: deploy-function
    outputs:
      spec-changed: ${{ steps.check-changes.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for function app to be ready
        run: |
          echo "Waiting for function app to be ready after deployment..."
          sleep 30

      - name: Fetch OpenAPI spec from deployed function
        run: |
          # Fetch the OpenAPI spec from the deployed function
          OPENAPI_URL="https://${{ env.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net/api/openapi/v3.json"
          
          echo "Fetching OpenAPI spec from: $OPENAPI_URL"
          
          for i in {1..5}; do
            HTTP_CODE=$(curl -s -o openapi.json -w "%{http_code}" "$OPENAPI_URL")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ OpenAPI spec fetched successfully"
              break
            fi
            echo "Attempt $i: Got HTTP $HTTP_CODE, retrying in 10s..."
            sleep 10
          done
          
          if [ ! -f openapi.json ] || [ ! -s openapi.json ]; then
            echo "⚠️ Could not fetch OpenAPI spec, skipping update"
            exit 0
          fi
          
          # Install yq for JSON to YAML conversion
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          
          # Convert to YAML
          yq -P openapi.json > apim/openapi.yaml
          echo "✅ OpenAPI spec converted to YAML"

      - name: Check for OpenAPI spec changes
        id: check-changes
        run: |
          git diff --quiet apim/openapi.yaml || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push OpenAPI spec
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add apim/openapi.yaml
          git commit -m "chore: auto-update OpenAPI spec [skip ci]"
          git push

  deploy-apim:
    runs-on: ubuntu-latest
    needs: update-openapi-spec
    if: needs.update-openapi-spec.outputs.spec-changed == 'true'
    env:
      APIM_NAME: ${{ secrets.APIM_NAME }}
      APIM_RESOURCE_GROUP: ${{ secrets.APIM_RESOURCE_GROUP }}
      API_ID: 'dotnetfunc-api'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          # Fetch latest to get the updated openapi.yaml
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin ${{ github.ref_name }}

      - name: Check APIM configuration
        id: check-apim
        run: |
          if [ -z "${{ secrets.APIM_NAME }}" ] || [ -z "${{ secrets.APIM_RESOURCE_GROUP }}" ]; then
            echo "⚠️ APIM_NAME or APIM_RESOURCE_GROUP secrets not configured, skipping APIM deployment"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Azure Login
        if: steps.check-apim.outputs.skip != 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Read API Information
        if: steps.check-apim.outputs.skip != 'true'
        id: api-info
        run: |
          API_PATH=$(jq -r '.properties.path' apim/apiinformation.json)
          API_DISPLAY_NAME=$(jq -r '.properties.displayName' apim/apiinformation.json)
          API_SERVICE_URL=$(jq -r '.properties.serviceUrl' apim/apiinformation.json)
          SUBSCRIPTION_REQUIRED=$(jq -r '.properties.subscriptionRequired' apim/apiinformation.json)
          
          echo "api_path=$API_PATH" >> $GITHUB_OUTPUT
          echo "api_display_name=$API_DISPLAY_NAME" >> $GITHUB_OUTPUT
          echo "api_service_url=$API_SERVICE_URL" >> $GITHUB_OUTPUT
          echo "subscription_required=$SUBSCRIPTION_REQUIRED" >> $GITHUB_OUTPUT

      - name: Import API to APIM
        if: steps.check-apim.outputs.skip != 'true'
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az apim api import \
              --resource-group ${{ env.APIM_RESOURCE_GROUP }} \
              --service-name ${{ env.APIM_NAME }} \
              --api-id ${{ env.API_ID }} \
              --path "${{ steps.api-info.outputs.api_path }}" \
              --display-name "${{ steps.api-info.outputs.api_display_name }}" \
              --service-url "${{ steps.api-info.outputs.api_service_url }}" \
              --specification-format OpenApi \
              --specification-path apim/openapi.yaml \
              --subscription-required ${{ steps.api-info.outputs.subscription_required }} \
              --protocols https
            
            echo "✅ API successfully imported to APIM"

      - name: Display API URL
        if: steps.check-apim.outputs.skip != 'true'
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            GATEWAY_URL=$(az apim show \
              --resource-group ${{ env.APIM_RESOURCE_GROUP }} \
              --name ${{ env.APIM_NAME }} \
              --query gatewayUrl -o tsv)
            
            echo "🚀 API is available at: ${GATEWAY_URL}/${{ steps.api-info.outputs.api_path }}/httptrigger1"
