# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# GitHub Actions workflow for deploying .NET isolated Azure Functions
# Based on: https://learn.microsoft.com/en-us/azure/azure-functions/functions-how-to-github-actions

name: Deploy Azure Function App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: 'red-scus-dotnetfunc-app'
  RESOURCE_GROUP: 'red-scus-dotnet-azfuncdemo-rg'
  LOCATION: 'southcentralus'
  DOTNET_VERSION: '8.0.x'
  # Bicep parameters (non-sensitive)
  ASP_NAME: 'dotnet-func-asp'
  SKU: 'EP1'
  LAW_NAME: 'red-scus-dotnetfunc-law'
  APP_INSIGHTS_NAME: 'red-scus-dotnetfunc-appinsights'
  STORAGE_ACCOUNT_NAME: 'redscusazfuncdemo582'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build and publish
        run: dotnet publish azfunc-demo.csproj -c Release -o ./publish

      - name: Create zip package
        run: |
          cd ./publish
          zip -r ../deployment.zip . -x "*.pdb"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: function-app-package
          path: deployment.zip

  deploy-infrastructure:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Bicep
        uses: azure/arm-deploy@v2
        with:
          scope: subscription
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          region: ${{ env.LOCATION }}
          deploymentName: dotnetcore-azfunction-deploy
          template: ./iac/bicep/create-dotnet-function-all.bicep
          parameters: >
            subscriptionId=${{ secrets.AZURE_SUBSCRIPTION_ID }}
            rgName=${{ env.RESOURCE_GROUP }}
            location=${{ env.LOCATION }}
            aspName=${{ env.ASP_NAME }}
            sku=${{ env.SKU }}
            lawName=${{ env.LAW_NAME }}
            appInsightsName=${{ env.APP_INSIGHTS_NAME }}
            storageAccountName=${{ env.STORAGE_ACCOUNT_NAME }}
            functionAppName=${{ env.AZURE_FUNCTIONAPP_NAME }}

  deploy-function:
    runs-on: ubuntu-latest
    needs: [build, deploy-infrastructure]
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: function-app-package

      - name: Deploy to Azure Functions
        run: |
          az functionapp deployment source config-zip \
            --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --src deployment.zip

  update-openapi-spec:
    runs-on: ubuntu-latest
    needs: deploy-function
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for function app to be ready
        run: |
          echo "Waiting for function app to be ready after deployment..."
          sleep 30

      - name: Fetch OpenAPI spec from deployed function
        run: |
          # Fetch the OpenAPI spec from the deployed function
          OPENAPI_URL="https://${{ env.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net/api/openapi/v3.json"
          
          echo "Fetching OpenAPI spec from: $OPENAPI_URL"
          
          for i in {1..5}; do
            HTTP_CODE=$(curl -s -o openapi.json -w "%{http_code}" "$OPENAPI_URL")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ OpenAPI spec fetched successfully"
              break
            fi
            echo "Attempt $i: Got HTTP $HTTP_CODE, retrying in 10s..."
            sleep 10
          done
          
          if [ ! -f openapi.json ] || [ ! -s openapi.json ]; then
            echo "⚠️ Could not fetch OpenAPI spec, skipping update"
            exit 0
          fi
          
          # Install yq for JSON to YAML conversion
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          
          # Convert to YAML
          yq -P openapi.json > apim/openapi.yaml
          echo "✅ OpenAPI spec converted to YAML"

      - name: Check for OpenAPI spec changes
        id: check-changes
        run: |
          git diff --quiet apim/openapi.yaml || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push OpenAPI spec
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add apim/openapi.yaml
          git commit -m "chore: auto-update OpenAPI spec [skip ci]"
          git push
